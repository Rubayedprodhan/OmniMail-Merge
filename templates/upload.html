<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>মেইল মার্চ ড্যাশবোর্ড</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen flex items-center justify-center font-sans">

    
    <div class="bg-gray-900 p-8 rounded-2xl shadow-2xl border border-gray-800 w-full max-w-md">
        <h2 class="text-2xl font-bold mb-2 text-center text-indigo-400">Bulk Email Sender</h2>
        <p class="text-gray-400 text-sm text-center mb-6">এক্সেল বা সিএসভি ফাইল আপলোড করে এক ক্লিকে সবাইকে মেইল পাঠান।</p>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-4 p-3 rounded text-sm text-center {% if message.tags == 'success' %}bg-green-950 border border-green-500 text-green-400{% else %}bg-red-950 border border-red-500 text-red-400{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form action="" method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">এক্সেল/সিএসভি ফাইল সিলেক্ট করুন</label>
                <input type="file" name="excel_file" accept=".xlsx, .xls, .csv" required
                    class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-700 cursor-pointer bg-gray-800 border border-gray-700 rounded-lg p-2 focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition duration-200 shadow-lg shadow-indigo-600/20">
                মেইল পাঠানো শুরু করুন
            </button>
        </form>
        
        <div class="mt-6 pt-4 border-t border-gray-800 text-center text-xs text-gray-500">
            কলামের নাম অবশ্যই <span class="text-gray-300 font-mono">Name</span> এবং <span class="text-gray-300 font-mono">Email</span> হতে হবে।
        </div>
    </div>

</body>
</html>
